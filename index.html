<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
    <title>Gigi Estilista</title>
  </head>
  <body>
    <header class="topo">
      <h1>Gigi <span>Estilista</span></h1>
    </header>
    <main class="atelie">
      <section class="painel painel-tecidos" aria-label="Materiais da estilista">
        <div class="abas" role="tablist" aria-label="Materiais">
          <button class="aba" role="tab" type="button" id="aba-tecidos" aria-controls="prateleira" aria-selected="true">🧵 Tecidos</button>
          <button class="aba" role="tab" type="button" id="aba-acessorios" aria-controls="acessorios" aria-selected="false" tabindex="-1">💎 Acessórios</button>
          <button class="aba" role="tab" type="button" id="aba-rosto" aria-controls="rosto" aria-selected="false" tabindex="-1">💇 Rosto</button>
        </div>
        <div id="prateleira" class="prateleira" role="tabpanel" aria-labelledby="aba-tecidos"></div>
        <div id="acessorios" class="opcoes" role="tabpanel" aria-labelledby="aba-acessorios" hidden></div>
        <div id="rosto" class="opcoes" role="tabpanel" aria-labelledby="aba-rosto" hidden></div>
      </section>

      <section class="painel painel-gigi">
        <div id="gigi" class="gigi"></div>
        <div id="cortes" class="cortes" hidden></div>
        <div class="acoes">
          <button id="desfazer" class="botao secundario" type="button">↶ Desfazer</button>
          <button id="tirar" class="botao secundario" type="button">Tirar roupa</button>
        </div>
      </section>

      <section class="painel painel-manequim" aria-label="Manequim">
        <div id="palco" class="palco"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
