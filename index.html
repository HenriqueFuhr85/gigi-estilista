<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
    <title>Gigi Estilista</title>
  </head>
  <body>
    <header class="topo">
      <h1>Gigi <span>Estilista</span></h1>
    </header>
    <main class="atelie">
      <section class="painel painel-tecidos" aria-labelledby="t-tecidos">
        <h2 id="t-tecidos">Tecidos</h2>
        <div id="prateleira" class="prateleira"></div>
      </section>

      <section class="painel painel-gigi">
        <div id="gigi" class="gigi"></div>
        <div id="cortes" class="cortes" hidden></div>
        <div class="acoes">
          <button id="desfazer" class="botao secundario" type="button">↶ Desfazer</button>
          <button id="tirar" class="botao secundario" type="button">Tirar roupa</button>
        </div>
      </section>

      <section class="painel painel-manequim" aria-label="Manequim">
        <div id="palco" class="palco"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
